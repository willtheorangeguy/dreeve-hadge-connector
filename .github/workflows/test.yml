name: Tests
on:
  workflow_call:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: ruff check .
  dreeve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: docker pull ghcr.io/dreeveapp/dreeve:v5.6.2
      - run: python -m tests.integration.run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-workflow-evidence
          path: integration-artifacts/
